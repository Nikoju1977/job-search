name: Niko Emploi - Validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier la syntaxe serveur et navigateur
        run: |
          node --check api/hidden-market.js
          node --check lib/hidden-market.js
          node --check public/radar-suivi.js
          node --check public/marche-cache.js
          node --check public/app.js
          node --check public/candidatures.js
          node --check server.js
          node --check api/letter.js
          node --check api/reply-agent.js
          node --check lib/candidate.js
          node --check public/niko-engine.js
          node --check public/niko-agents.js
          node --check api/engine-cron.js
          node --check public/v2.js
          node --check public/v2-dossiers.js
      - name: Tester le moteur de recherche et le studio
        run: npm test
      - name: Parcours utilisateur Chromium (radar, suivi, Studio)
        timeout-minutes: 4
        run: node tests/browser-smoke.js
      - name: Contrôler le site public réel (GET uniquement, aucune donnée candidat)
        run: node tests/production-audit.js
        env:
          NIKO_JOB_AUDIT_REPORT: ${{ runner.temp }}/niko-emploi-http-audit.json
          NIKO_JOB_AUDIT_STRICT: '0'
      - name: Archiver les preuves HTTP de la production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niko-emploi-production-http
          path: ${{ runner.temp }}/niko-emploi-http-audit.json
          if-no-files-found: warn
          retention-days: 7
